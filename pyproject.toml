[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tadris"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6", "reportlab", "openpyxl", "platformdirs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tadris = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
